name: Build

on:
  push:
    branches:
      - "main"
      - "release-*"
      - '1.1.0-est*'
  pull_request:
    branches:
      - "*"

# Declare default permissions as read only
permissions:
  contents: read

# Cancel previous builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build Strimzi Java code and does basic checks of the PR
  build-strimzi:
    name: Build Strimzi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Build workflow trigger via pull_request will have merge commit sha in github.sha
      - name: Store build commit sha
        run: |
          echo "${{ github.sha }}" > commit-sha.txt
          echo "Stored commit SHA: ${{ github.sha }}"

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: commit-sha.txt
          path: commit-sha.txt

      - name: Remove commit-sha.txt
        run: |
          rm -rf commit-sha.txt

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@v2
        with:
          javaVersion: "21"

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@v2
        with:
          version: "v4.6.3"

      - name: Install Shellcheck
        uses: strimzi/github-actions/.github/actions/dependencies/install-shellcheck@v2
        with:
          version: "0.11.0"

      - name: Install Helm
        uses: strimzi/github-actions/.github/actions/dependencies/install-helm@v2
        with:
          helmVersion: "v3.16.0"

      - name: Restore Kafka binaries cache
        uses: actions/cache/restore@v5
        with:
          path: docker-images/artifacts/binaries/kafka/archives
          key: kafka-binaries-${{ hashFiles('kafka-versions.yaml') }}
          restore-keys: |
            kafka-binaries-

      - name: Build binaries using build-binaries action
        uses: strimzi/github-actions/.github/actions/build/build-binaries@v2
        with:
          mainJavaBuild: "true"
          artifactSuffix: "operators"
          clusterOperatorBuild: "true"
        env:
          # Skip tests for both runs as we will run tests in parallel
          MVN_ARGS: "-B -DskipTests -Dmaven.javadoc.skip=true"

      - name: Save Kafka binaries cache
        # Save maven cache only after pushes into default branch
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v5
        with:
          path: docker-images/artifacts/binaries/kafka/archives
          key: kafka-binaries-${{ hashFiles('kafka-versions.yaml') }}

  # Runs Strimzi unit and integration tests
  test-strimzi:
    name: Strimzi Unit & IT tests
    needs:
      - build-strimzi
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build/test-strimzi

  # Builds Strimzi docs
  build-docs:
    name: Build docs
    needs:
      - build-strimzi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@v2
        with:
          version: "v4.6.3"

      - name: Install AsciiDoctor
        uses: strimzi/github-actions/.github/actions/dependencies/install-ascii-doctor@v2
        with:
          rubyVersion: "3.2"

      - uses: ./.github/actions/build/build-docs
        with:
          artifactName: "documentation.tar"

  # Builds Strimzi containers
  build-containers:
    name: Build Containers
    needs:
      - build-strimzi
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64
          - s390x
          - ppc64le
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Docker
        uses: strimzi/github-actions/.github/actions/dependencies/install-docker@v2

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@v2
        with:
          version: "v4.6.3"

      - name: Install Shellcheck
        uses: strimzi/github-actions/.github/actions/dependencies/install-shellcheck@v2
        with:
          version: "0.11.0"

      - uses: strimzi/github-actions/.github/actions/build/build-containers@v2
        with:
          architecture: ${{ matrix.architecture }}
          imagesLocation: "./docker-images/container-archives"
          artifactSuffix: "operators"

  # Push Strimzi containers - run only on 1.1.0-est branch
  push-containers:
    name: Push Containers
    needs:
      - build-strimzi
      - test-strimzi
      - build-containers
      - build-docs
    if: ${{ startsWith(github.ref, 'refs/heads/1.1.0-est') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Docker
        uses: strimzi/github-actions/.github/actions/dependencies/install-docker@v2

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@v2
        with:
          version: "v4.6.3"

      - name: Install Syft
        uses: strimzi/github-actions/.github/actions/dependencies/install-syft@v2
        with:
          version: "1.20.0"

      - name: Push containers using push-containers action
        uses: strimzi/github-actions/.github/actions/build/push-containers@v2
        with:
          registryUser: ${{ secrets.DOCKER_USERNAME }}
          registryPassword: ${{ secrets.DOCKER_TOKEN }}
          containerRegistry: "registry.nordix.org"
          containerOrg: "allies/strimzi"
          containerTag: "latest"
          architectures: "amd64,arm64,ppc64le,s390x"
          artifactSuffix: "operators"

  # Deploy Strimzi Java artifacts to Nordix Artifactory - run only on 1.1.0-est branch
  deploy-java:
    name: Deploy Java artifacts
    needs:
      - build-strimzi
      - test-strimzi
      - build-containers
      - build-docs
    if: ${{ startsWith(github.ref, 'refs/heads/1.1.0-est') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@v2
        with:
          javaVersion: "21"

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@v2
        with:
          version: "v4.6.3"

      - name: Deploy to Nordix Artifactory
        shell: bash
        run: ./.azure/scripts/push-to-central.sh
        env:
          MVN_ARGS: "-B"
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
