  # Push containers (e.g., 1.1.0-est-1)
  push-containers:
    name: Push Containers (${{ inputs.releaseVersion }})
    needs:
      - prepare-release-artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/1.1.0-est') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Docker
        uses: strimzi/github-actions/.github/actions/dependencies/install-docker@v2

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@v2
        with:
          version: "v4.6.3"

      - name: Install Syft
        uses: strimzi/github-actions/.github/actions/dependencies/install-syft@v2
        with:
          version: "1.20.0"

      - name: Push containers using push-containers action
        uses: strimzi/github-actions/.github/actions/build/push-containers@v2
        with:
          registryUser: ${{ secrets.DOCKER_USERNAME }}
          registryPassword: ${{ secrets.DOCKER_TOKEN }}
          containerRegistry: "registry.nordix.org"
          containerOrg: "allies/strimzi"
          containerTag: "${{ inputs.releaseVersion }}"
          architectures: "amd64,arm64,ppc64le,s390x"
          artifactSuffix: "operators"
          buildRunId: ${{ inputs.sourceBuildRunId }}

