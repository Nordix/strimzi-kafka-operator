name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release Version (e.g., 1.1.0-est-1, 1.1.0-est-2)'
        required: true
        type: string
      # useSuffix:
      #   description: 'Build suffixed images (e.g., 0.49.0-0 before final 0.49.0)'
      #   required: true
      #   type: boolean
      #   default: true
      # releaseSuffix:
      #   description: 'Release Suffix (e.g., 0 for 0.49.0-0, used only if useSuffix is true)'
      #   required: true
      #   type: string
      #   default: '0'
      sourceBuildRunId:
        description: 'GitHub Actions Run ID of the source build (find in Actions tab URL)'
        required: true
        type: string

# Declare default permissions as read only
permissions:
  contents: read

jobs:
  # Prepare release artifacts - builds release files and pushes to Nordix Artifactory
  prepare-release-artifacts:
    name: Prepare Release Artifacts
    if: ${{ startsWith(github.ref, 'refs/heads/1.1.0-est') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@v2
        with:
          javaVersion: "21"

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@v2
        with:
          version: "v4.6.3"

      - name: Install Helm
        uses: strimzi/github-actions/.github/actions/dependencies/install-helm@v2
        with:
          helmVersion: "v3.16.0"

      - name: Install AsciiDoctor
        uses: strimzi/github-actions/.github/actions/dependencies/install-ascii-doctor@v2
        with:
          rubyVersion: "3.2"

      - name: Prepare release artifacts
        uses: strimzi/github-actions/.github/actions/build/release-artifacts@v2
        with:
          releaseVersion: ${{ inputs.releaseVersion }}
          artifactSuffix: "operators"

      - name: Deploy to Nordix Artifactory
        shell: bash
        run: ./.azure/scripts/push-to-central.sh
        env:
          MVN_ARGS: "-B"
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: "Build documentation"
        uses: ./.github/actions/build/build-docs
        with:
          artifactName: "documentation.tar"
          releaseVersion: ${{ inputs.releaseVersion }}

